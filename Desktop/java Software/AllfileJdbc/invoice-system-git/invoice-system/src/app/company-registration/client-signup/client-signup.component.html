<div class="form-wrapper">
  <h2 class="form-heading">Register Client</h2>
  
  <form [formGroup]="clientForm" (ngSubmit)="onSubmit()">
    <div class="form-card">
      <div class="form-grid">
        <input type="text" class="form-input" formControlName="firstName" placeholder="First Name" />
        <input type="text" class="form-input" formControlName="lastName" placeholder="Last Name" />
        <input type="email" class="form-input" formControlName="email" placeholder="Email" />
        <input type="text" class="form-input" formControlName="mobileNumber" placeholder="Mobile Number" />
        <input type="text" class="form-input" formControlName="companyName" placeholder="Company Name" />
        <input type="text" class="form-input" formControlName="businessName" placeholder="Business Name" />
        <input type="text" class="form-input" formControlName="address" placeholder="Address" />
        <input type="text" class="form-input" formControlName="billingAddress" placeholder="Billing Address" />
        <input type="text" class="form-input" formControlName="postalZipCode" placeholder="ZIP Code" />
        <input type="text" class="form-input" formControlName="linkedinProfileUrl" placeholder="LinkedIn Profile URL" />
        <input type="text" class="form-input" formControlName="panNumber" placeholder="PAN Number" />
        <input type="text" class="form-input" formControlName="username" placeholder="Username" />
        <input type="password" class="form-input" formControlName="password" placeholder="Password" />
        <textarea rows="3" class="form-input" formControlName="specificRegistrationDetails" placeholder="Specific Registration Details (Optional)"></textarea>
      </div>
      <button type="submit" class="submit-btn" [disabled]="clientForm.invalid || isSubmitting">
        {{ isSubmitting ? 'Registering...' : 'Register Client' }}
      </button>
    </div>
  </form>
</div>
