<div class="expenses-card">
  <div class="header">
    <h4>Expenses</h4>
    <select>
      <option>This week</option>
      <option>Last week</option>
    </select>
  </div>

  <div class="radial-chart">
    <apx-chart
      [series]="[78]"
      [chart]="{ type: 'radialBar', height: 200 }"
      [plotOptions]="{
        radialBar: {
          hollow: { size: '60%' },
          track: { background: '#eee' },
          dataLabels: {
            value: { fontSize: '20px', show: true },
            name: { show: false }
          }
        }
      }"
      [labels]="['Progress']"
      [colors]="['#8B5CF6']"
    ></apx-chart>
    <p class="total-amount">23,316</p>
    <p class="label">All Total</p>
  </div>

  <div class="profit-box">
    <div>
      <h5>Taxable Profit</h5>
      <p>12,625</p>
    </div>
    <div class="growth-tag">+2.31%</div>
  </div>

  <div class="mini-stats">
    <div class="stat">
      <span class="dot income"></span>
      <div>
        <small>Total Income</small>
        <strong>23,316</strong>
      </div>
      <span class="percentage orange">+2.3%</span>
    </div>

    <div class="stat">
      <span class="dot outcome"></span>
      <div>
        <small>Total Outcome</small>
        <strong>23,316</strong>
      </div>
      <span class="percentage red">-1.1%</span>
    </div>

    <div class="stat">
      <span class="dot profit"></span>
      <div>
        <small>Taxable Profit</small>
        <strong>25,316</strong>
      </div>
      <span class="percentage purple">+3.2%</span>
    </div>
  </div>
</div>
