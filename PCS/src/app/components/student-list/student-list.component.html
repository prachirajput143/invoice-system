<div class="list-container">
  <h2>Student List</h2>
  <table *ngIf="students.length > 0">
    <thead>
      <tr>
        <th>#</th>
        <th>Name</th>
        <th>Age</th>
        <th>Email</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let student of students; let i = index">
        <td>{{ i + 1 }}</td>
        <td>{{ student.name }}</td>
        <td>{{ student.age }}</td>
        <td>{{ student.email }}</td>
        <td>
          <button (click)="deleteStudent(i)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
  <p *ngIf="students.length === 0">No students added yet.</p>
</div>
