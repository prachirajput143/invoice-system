<div class="update-container">
    <h2 class="title">
      <i class="fas fa-edit"></i> Update Company
    </h2>
  
    <!-- Success and Error Messages -->
    <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>
  
    <div class="update-card">
      <form [formGroup]="updateForm" (ngSubmit)="updateCompany()">
        <!-- Select Company -->
        <div class="form-row">
          <label for="companyId" class="form-label">Select Company</label>
          <select
            id="companyId"
            class="form-input"
            (change)="onCompanySelect($event)"
            [ngClass]="{ 'is-invalid': updateForm.get('id')?.invalid && updateForm.get('id')?.touched }"
          >
            <option value="" disabled selected>Select a company</option>
            <option *ngFor="let company of allCompanies" [value]="company.id">
              {{ company.name }} (ID: {{ company.id }})
            </option>
          </select>
        </div>
  
        <!-- Company Details Form -->
        <div *ngIf="companyFound" class="form-details">
          <div class="form-row">
            <label for="name" class="form-label">Company Name</label>
            <input type="text" id="name" formControlName="name" class="form-input" />
          </div>
  
          <div class="form-row">
            <label for="address" class="form-label">Address</label>
            <input type="text" id="address" formControlName="address" class="form-input" />
          </div>
  
          <div class="form-row">
            <label for="companyPhone" class="form-label">Phone</label>
            <input type="text" id="companyPhone" formControlName="companyPhone" class="form-input" />
          </div>
  
          <div class="form-row">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" formControlName="email" class="form-input" />
          </div>
  
          <div class="form-row">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" formControlName="password" class="form-input" />
          </div>
  
          <div class="form-row">
            <label for="taxPayer" class="form-label">Tax Payer</label>
            <input type="text" id="taxPayer" formControlName="taxPayer" class="form-input" />
          </div>
  
          <div class="form-row">
            <label for="website" class="form-label">Website</label>
            <input type="text" id="website" formControlName="website" class="form-input" />
          </div>
  
          <div class="form-row">
            <label for="adminUserName" class="form-label">Admin Username</label>
            <input type="text" id="adminUserName" formControlName="adminUserName" class="form-input" />
          </div>
  
          <!-- Submit Button -->
          <div class="button-wrapper">
            <button type="submit" class="submit-button" [disabled]="updateForm.invalid">Update Company</button>
          </div>
        </div>
      </form>
    </div>
  </div>
